name: Build and deploy Azure Function App - freebet-tracker-reminder

on:
  push:
    branches:
      - main
    paths:
      - 'FreebetTracker.Functions/**'
      - 'FreebetTracker.Web/**'
      - 'FreebetTracker.Tests/**'
      - 'FreebetTracker.slnx'
      - '.github/workflows/main_freebettracker_functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'
          skip-lts-prepass: true

      - name: Restore dependencies
        run: dotnet restore FreebetTracker.slnx

      - name: Build solution
        run: dotnet build FreebetTracker.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test FreebetTracker.slnx --configuration Release --no-build --verbosity normal

      - name: Publish Azure Function
        run: dotnet publish FreebetTracker.Functions/FreebetTracker.Functions.csproj --configuration Release --output ./publish

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: function-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v8
        with:
          name: function-app
          path: ./publish

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: 'freebet-tracker-reminder'
          package: ./publish
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
