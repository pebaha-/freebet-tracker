name: Build and deploy Azure Function App - freebet-tracker-reminder

on:
  push:
    branches:
      - main
    paths:
      - 'FreebetTracker.Functions/**'
      - 'FreebetTracker.Web/**'
      - 'FreebetTracker.Tests/**'
      - 'FreebetTracker.slnx'
      - '.github/workflows/main_freebettracker_functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'
          skip-lts-prepass: true

      - name: Restore dependencies
        run: dotnet restore FreebetTracker.slnx

      - name: Build solution
        run: dotnet build FreebetTracker.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test FreebetTracker.slnx --configuration Release --no-build --verbosity normal

      - name: Publish Azure Function
        run: dotnet publish FreebetTracker.Functions/FreebetTracker.Functions.csproj --configuration Release --output ./publish

      - name: Verify published Function package
        shell: bash
        run: |
          echo "=== Publish output root ==="
          ls -la ./publish

          echo "=== Published files ==="
          find ./publish -maxdepth 2 -type f -print | sort | head -200

          echo "=== Required files ==="
          for item in .azurefunctions extensions.json functions.metadata host.json worker.config.json; do
            if [ -e "./publish/$item" ]; then
              echo "FOUND: $item"
            else
              echo "MISSING: $item"
            fi
          done

          test -d ./publish/.azurefunctions || {
            echo "ERROR: .azurefunctions is missing from publish output"
            exit 1
          }

          test -f ./publish/host.json || {
            echo "ERROR: host.json is missing from publish output"
            exit 1
          }

          test -f ./publish/functions.metadata || {
            echo "ERROR: functions.metadata is missing from publish output"
            exit 1
          }

          echo "Function publish output contains the required files."

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: function-app
          path: ./publish
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v8
        with:
          name: function-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E6CA1F51FBE846B6AC27FE3F7A6F8819 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D52D08BB80334184B8028A39F5270DE7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DF31F64CE77F4677AA2D420287A5D3C2 }}

      - name: Diagnose Function App configuration
        uses: azure/CLI@v2
        with:
          inlineScript: |
            set -e

            APP="freebet-tracker-reminder"
            RG="FreebetTracker_RG"

            echo "=== Azure context ==="
            az account show \
              --query "{subscription:name, subscriptionId:id, tenantId:tenantId}" \
              --output json

            echo "=== Function App resource ==="
            az resource show \
              --resource-group "$RG" \
              --name "$APP" \
              --resource-type "Microsoft.Web/sites" \
              --query "{id:id, name:name, location:location, kind:kind, properties:properties}" \
              --output json

            echo "=== Function App details ==="
            az functionapp show \
              --name "$APP" \
              --resource-group "$RG" \
              --query "{name:name, kind:kind, state:state, hostNames:hostNames, sku:sku, serverFarmId:serverFarmId, functionAppConfig:functionAppConfig}" \
              --output json

            echo "=== Function App configuration ==="
            az functionapp config show \
              --name "$APP" \
              --resource-group "$RG" \
              --output json

            echo "=== Hosting plan ID ==="
            PLAN_ID=$(az functionapp show \
              --name "$APP" \
              --resource-group "$RG" \
              --query "serverFarmId" \
              --output tsv)

            echo "Plan ID: $PLAN_ID"

            if [ -n "$PLAN_ID" ] && [ "$PLAN_ID" != "None" ]; then
              echo "=== Hosting plan SKU ==="
              az resource show \
                --ids "$PLAN_ID" \
                --query "{id:id, name:name, kind:kind, sku:sku, location:location, properties:properties}" \
                --output json
            else
              echo "No serverFarmId returned by the CLI query."
              echo "Checking Function App site configuration."
              az resource show \
                --resource-group "$RG" \
                --name "$APP" \
                --resource-type "Microsoft.Web/sites/config" \
                --output json
            fi

            echo "=== Relevant application settings ==="
            az functionapp config appsettings list \
              --name "$APP" \
              --resource-group "$RG" \
              --query "[?name=='WEBSITE_RUN_FROM_PACKAGE' || name=='FUNCTIONS_WORKER_RUNTIME' || name=='FUNCTIONS_EXTENSION_VERSION' || name=='SCM_DO_BUILD_DURING_DEPLOYMENT' || name=='ENABLE_ORYX_BUILD' || name=='DEPLOYMENT_STORAGE_CONNECTION_STRING'].{name:name,value:value}" \
              --output table

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: 'freebet-tracker-reminder'
          package: ./publish
          sku: flexconsumption
