name: Build and deploy Azure Function App - freebet-tracker-reminder

on:
  push:
    branches:
      - main
    paths:
      - 'FreebetTracker.Functions/**'
      - 'FreebetTracker.Web/**'
      - 'FreebetTracker.Tests/**'
      - 'FreebetTracker.slnx'
      - '.github/workflows/main_freebettracker_functions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.402'
          skip-lts-prepass: true

      - name: Restore dependencies
        run: dotnet restore FreebetTracker.slnx

      - name: Build solution
        run: dotnet build FreebetTracker.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test FreebetTracker.slnx --configuration Release --no-build --verbosity normal

      - name: Publish Azure Function
        run: dotnet publish FreebetTracker.Functions/FreebetTracker.Functions.csproj --configuration Release --output ./publish

      - name: Upload deployment package
        uses: actions/upload-artifact@v7
        with:
          name: function-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v8
        with:
          name: function-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_E6CA1F51FBE846B6AC27FE3F7A6F8819 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D52D08BB80334184B8028A39F5270DE7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DF31F64CE77F4677AA2D420287A5D3C2 }}

      - name: Show Azure context
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az account show --query "{subscription:name, subscriptionId:id, tenantId:tenantId}" --output json
            az functionapp list --query "[].{name:name, resourceGroup:resourceGroup, location:location}" --output table

      - name: Diagnose Function App
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az account show --output table
            az functionapp list --output json
            az functionapp show \
              --name freebet-tracker-reminder \
              --resource-group FreebetTracker_RG \
              --output json

      - name: Deploy Azure Function App
        uses: Azure/functions-action@v1
        with:
          app-name: 'freebet-tracker-reminder'
          package: ./publish
